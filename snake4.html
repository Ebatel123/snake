<!DOCTYPE html>
<html>
<head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Змейка+ Deluxe</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { display:flex; flex-direction:column; justify-content:center; align-items:center;
         margin:0; background:radial-gradient(circle at 50% 30%, #1a1a2e 0%, #0d0d15 100%);
         font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color:#fff;
         touch-action:none; user-select:none; -webkit-user-select:none; overflow:hidden; }
  canvas { background:#0a0a12; border:2px solid #0f0; border-radius:12px;
           box-shadow:0 0 30px rgba(0,255,0,0.25), inset 0 0 40px rgba(0,255,0,0.05);
           max-width:96vw; max-height:72vh; touch-action:none; display:block; }
  #hud { display:flex; gap:16px; margin-top:8px; font-size:14px; align-items:center; }
  #hud span { color:#0f0; font-weight:bold; text-shadow:0 0 8px #0f0; }
  #hud .coins span { color:#ffd700; text-shadow:0 0 8px #ffd700; }
  #hud .stars span { color:#39f; text-shadow:0 0 8px #39f; }
  #musicBtn { background:none; border:1px solid #555; color:#aaa; border-radius:8px;
              padding:4px 10px; font-size:14px; cursor:pointer; font-family:inherit; }
  #musicBtn.on { color:#0f0; border-color:#0f0; }
  #controls { display:flex; gap:10px; margin-top:10px; }
  .btn { padding:10px 22px; font-size:14px; cursor:pointer;
         border:none; border-radius:10px; color:#111; font-weight:bold;
         transition:transform .15s; font-family:inherit; }
  .btn:active { transform:scale(0.95); }
  .btn-green { background:linear-gradient(135deg,#0f0,#0a0); box-shadow:0 4px 20px rgba(0,255,0,0.4); }
  .btn-gray  { background:linear-gradient(135deg,#aaa,#666); color:#fff; box-shadow:0 4px 20px rgba(150,150,150,0.3); }
  .hidden { display:none !important; }
</style></head>
<body>
<canvas id="c" width="560" height="560"></canvas>
<div id="hud">
  <div>Счёт: <span id="score">0</span></div>
  <div class="coins">🪙 <span id="coins">0</span></div>
  <div class="stars">⭐ <span id="stars">0</span></div>
  <button id="musicBtn" title="Музыка">♪</button>
</div>
<div id="controls">
  <button id="btn" class="btn btn-green hidden">Заново</button>
  <button id="menuBtn" class="btn btn-gray hidden">← Меню</button>
</div>
<script>
const cv = document.getElementById('c');
const c = cv.getContext('2d');
const btn = document.getElementById('btn');
const menuBtn = document.getElementById('menuBtn');
const musicBtn = document.getElementById('musicBtn');
const scoreEl = document.getElementById('score');
const coinsEl = document.getElementById('coins');
const starsEl = document.getElementById('stars');
const S = 20, N = 28;               // 28×28 = 560×560
const W = N * S;
const STEP_MS = 150;
const BONUS_MS = 3000;
const ANIM_MS = 110;

const SKINS = {
  green:  { name:'Зелёная',      price:0,  head:'#bfffbf', body:['#00ff44','#00cc33'], eye:'#111', crown:false, stripes:false },
  red:    { name:'Красная',      price:10, head:'#ffb3b3', body:['#ff3333','#cc0000'], eye:'#111', crown:false, stripes:false },
  blue:   { name:'Синяя',        price:10, head:'#b3d9ff', body:['#3399ff','#0066cc'], eye:'#111', crown:false, stripes:false },
  adidas: { name:'Адидас',       price:25, head:'#555555', body:['#222222','#000000'], eye:'#fff', crown:false, stripes:true  },
  king:   { name:'Королевская',  price:50, head:'#ffe680', body:['#ffcc00','#cc9900'], eye:'#111', crown:true,  stripes:false }
};

let state = 'menu';
let snake, dir, dirQueue, food, bonus, bonusUntil, score, dead, best;
let foodCount = 0;
let starsCollected = 0;
let paused = false;
let particles = [];
let lastStep = 0;
let prevSnake = [];
let toast = null;
let shopItems = [];

let coins = Number(localStorage.getItem('snakeCoins') || 0);
let ownedSkins = JSON.parse(localStorage.getItem('snakeSkins') || '["green"]');
let currentSkin = localStorage.getItem('snakeSkin') || 'green';
if (!ownedSkins.includes('green')) ownedSkins.push('green');
if (!ownedSkins.includes(currentSkin)) currentSkin = 'green';
best = Number(localStorage.getItem('snakeBest') || 0);
let musicOn = localStorage.getItem('snakeMusic') !== 'off';

scoreEl.textContent = '0';
coinsEl.textContent = coins;
starsEl.textContent = '0';
musicBtn.textContent = musicOn ? '♪' : '✕';
musicBtn.classList.toggle('on', musicOn);

// ==================== ЗВУК ====================
let audioCtx, musicTimer = null, musicPlaying = false;
function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e) { audioCtx = null; }
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function beep(freq, dur=0.08, type='square', vol=0.06) {
  if (!audioCtx) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime + dur);
}

const MELODY = [
  [659,2],[494,1],[523,1],[587,1],[523,1],[494,1],[440,2],[440,2],
  [523,1],[659,2],[587,1],[523,1],[494,2],[494,1],[523,1],[587,2],
  [659,2],[523,2],[440,2],[440,2],
  [587,1],[698,2],[880,1],[784,1],[698,1],[659,2],[523,1],[659,2],
  [587,1],[523,1],[494,2],[494,1],[523,1],[587,2],[659,2],[523,2],
  [440,2],[440,2]
];
const BASS_TETRIS = [131,131,131,131, 110,110,110,110, 131,131,131,131, 165,165,165,165];
let melodyIdx = 0, bassIdx = 0;
const TETRIS_BPM = 0.16;

function startMusic() {
  ensureAudio();
  if (musicPlaying || !audioCtx || !musicOn) return;
  musicPlaying = true;
  melodyIdx = 0; bassIdx = 0;
  scheduleMusicNote();
}
function stopMusic() {
  musicPlaying = false;
  if (musicTimer) { clearTimeout(musicTimer); musicTimer = null; }
}
function scheduleMusicNote() {
  if (!musicPlaying || !audioCtx || !musicOn) { musicPlaying = false; return; }
  const [freq, beats] = MELODY[melodyIdx % MELODY.length];
  const dur = beats * TETRIS_BPM;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = 'square'; o.frequency.value = freq;
  g.gain.setValueAtTime(0.028, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur*0.85);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime + dur);

  if (melodyIdx % 2 === 0) {
    const bf = BASS_TETRIS[(bassIdx++) % BASS_TETRIS.length];
    const bo = audioCtx.createOscillator();
    const bg = audioCtx.createGain();
    bo.type = 'triangle'; bo.frequency.value = bf;
    bg.gain.setValueAtTime(0.035, audioCtx.currentTime);
    bg.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur*1.7);
    bo.connect(bg); bg.connect(audioCtx.destination);
    bo.start(); bo.stop(audioCtx.currentTime + dur*1.8);
  }
  melodyIdx++;
  musicTimer = setTimeout(scheduleMusicNote, dur * 1000);
}

function soundEat() { beep(660, 0.08, 'square', 0.07); }
function soundBonus() {
  beep(660, 0.05, 'square', 0.07);
  setTimeout(()=>beep(880, 0.05, 'square', 0.07), 45);
  setTimeout(()=>beep(1100, 0.05, 'square', 0.07), 90);
  setTimeout(()=>beep(1320, 0.10, 'square', 0.08), 135);
  setTimeout(()=>beep(1760, 0.15, 'triangle', 0.06), 185);
}
function soundDie() { beep(200, 0.15, 'sawtooth', 0.1); setTimeout(()=>beep(120,0.3,'sawtooth',0.1), 120); }
function soundCoin() {
  beep(1320, 0.05, 'square', 0.06);
  setTimeout(()=>beep(1760, 0.08, 'square', 0.06), 50);
}
function soundBuy() {
  beep(523, 0.07, 'square', 0.07);
  setTimeout(()=>beep(659, 0.07, 'square', 0.07), 60);
  setTimeout(()=>beep(784, 0.12, 'square', 0.07), 120);
}
function soundClick() { beep(800, 0.03, 'square', 0.05); }
function vib(ms) { if (navigator.vibrate) navigator.vibrate(ms); }

function spawnParticles(gx, gy, color, count=14) {
  const cx = gx*S + S/2, cy = gy*S + S/2;
  for (let i=0; i<count; i++) {
    const a = Math.random()*Math.PI*2;
    const sp = 1 + Math.random()*3;
    particles.push({
      x: cx, y: cy, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
      life: 1, color, size: 2 + Math.random()*3
    });
  }
}

// ==================== ВАЖНО: буфер направлений ====================
// Нажатия не меняют dir мгновенно, а ставятся в очередь.
// На каждом шаге змейка берёт одно направление из очереди.
function pushDir(newDir) {
  if (dirQueue.length >= 3) return; // не копим слишком много
  const last = dirQueue.length > 0 ? dirQueue[dirQueue.length-1] : dir;
  // нельзя разворачиваться на 180°
  if (newDir.x === -last.x && newDir.y === -last.y) return;
  // нельзя дублировать
  if (newDir.x === last.x && newDir.y === last.y) return;
  dirQueue.push(newDir);
}

function reset() {
  snake = [{x:Math.floor(N/2), y:Math.floor(N/2)}];
  prevSnake = snake.map(s=>({...s}));
  dir = {x:1,y:0};
  dirQueue = [];
  score = 0; dead = false; foodCount = 0; paused = false;
  starsCollected = 0;
  bonus = null; bonusUntil = 0;
  particles = [];
  scoreEl.textContent = '0';
  starsEl.textContent = '0';
  placeFood();
  btn.classList.add('hidden');
  menuBtn.classList.add('hidden');
  lastStep = performance.now();
  state = 'game';
  if (musicOn) startMusic();
}

function placeFood() {
  do { food = {x: Math.floor(Math.random()*N), y: Math.floor(Math.random()*N)}; }
  while (snake.some(s=>s.x===food.x&&s.y===food.y) ||
         (bonus && bonus.x===food.x && bonus.y===food.y));
}

function showToast(text, ms=1800) { toast = { text, until: performance.now() + ms }; }

function step() {
  if (dead || paused) return;

  // берём направление из очереди (ровно одно за шаг)
  if (dirQueue.length > 0) {
    dir = dirQueue.shift();
  }

  prevSnake = snake.map(s=>({...s}));
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

  if (head.x<0||head.x>=N||head.y<0||head.y>=N||
      snake.some(s=>s.x===head.x&&s.y===head.y)) {
    dead = true;
    soundDie();
    vib([60,40,60]);

    const earnedFromScore = Math.floor(score / 10) * 5;
    const earnedFromStars = starsCollected;
    const total = earnedFromScore + earnedFromStars;
    if (total > 0) {
      coins += total;
      localStorage.setItem('snakeCoins', coins);
      coinsEl.textContent = coins;
      let msg = '+' + total + ' 🪙';
      if (earnedFromScore > 0 && earnedFromStars > 0) {
        msg += ' (' + earnedFromScore + ' за счёт + ' + earnedFromStars + ' за ⭐)';
      } else if (earnedFromStars > 0) {
        msg += ' за ' + earnedFromStars + ' ⭐';
      }
      showToast(msg, 3000);
      setTimeout(soundCoin, 500);
    }
    if (score > best) { best = score; localStorage.setItem('snakeBest', best); }
    btn.classList.remove('hidden');
    menuBtn.classList.remove('hidden');
    return;
  }

  snake.unshift(head);

  if (head.x===food.x && head.y===food.y) {
    score++; foodCount++;
    scoreEl.textContent = score;
    soundEat(); vib(20);
    spawnParticles(food.x, food.y, '#f33', 12);
    placeFood();
    if (foodCount % 5 === 0) {
      do { bonus = {x: Math.floor(Math.random()*N), y: Math.floor(Math.random()*N)}; }
      while (snake.some(s=>s.x===bonus.x&&s.y===bonus.y) ||
             (bonus.x===food.x && bonus.y===food.y));
      bonusUntil = performance.now() + BONUS_MS;
    }
  }
  else if (bonus && head.x===bonus.x && head.y===bonus.y) {
    score += 2; scoreEl.textContent = score;
    starsCollected++;
    starsEl.textContent = starsCollected;
    coins += 1;
    localStorage.setItem('snakeCoins', coins);
    coinsEl.textContent = coins;
    spawnParticles(bonus.x, bonus.y, '#39f', 20);
    soundBonus(); vib(30);
    showToast('+1 🪙 за звезду!', 1200);
    bonus = null;
  }
  else {
    snake.pop();
  }
}

function goToMenu() {
  stopMusic();
  state = 'menu';
  dead = false;
  btn.classList.add('hidden');
  menuBtn.classList.add('hidden');
}

// ==================== КЛАВИАТУРА ====================
const KEY_MAP = {
  'arrowup':    {x:0,y:-1}, 'w': {x:0,y:-1},
  'arrowdown':  {x:0,y:1},  's': {x:0,y:1},
  'arrowleft':  {x:-1,y:0}, 'a': {x:-1,y:0},
  'arrowright': {x:1,y:0},  'd': {x:1,y:0}
};

document.addEventListener('keydown', e => {
  ensureAudio();
  const key = e.key.toLowerCase();

  if (key === 'p') { if (state === 'game' && !dead) paused = !paused; e.preventDefault(); return; }

  if (state === 'game') {
    if (dead && (key === 'enter' || key === ' ')) { reset(); e.preventDefault(); return; }
    if (dead && key === 'escape') { goToMenu(); e.preventDefault(); return; }

    if (KEY_MAP[key]) {
      pushDir(KEY_MAP[key]);
      e.preventDefault();
    }
  }
});

btn.addEventListener('click', () => { ensureAudio(); soundClick(); reset(); });
menuBtn.addEventListener('click', () => { ensureAudio(); soundClick(); goToMenu(); });

musicBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  ensureAudio();
  musicOn = !musicOn;
  localStorage.setItem('snakeMusic', musicOn ? 'on' : 'off');
  musicBtn.textContent = musicOn ? '♪' : '✕';
  musicBtn.classList.toggle('on', musicOn);
  if (musicOn) {
    if (state === 'game' && !dead) startMusic();
  } else {
    stopMusic();
  }
  soundClick();
});

// ==================== КООРДИНАТЫ ====================
function canvasPos(e) {
  const r = cv.getBoundingClientRect();
  let cx, cy;
  if (e.touches) { cx = e.touches[0].clientX; cy = e.touches[0].clientY; }
  else { cx = e.clientX; cy = e.clientY; }
  return {
    x: (cx - r.left) / r.width * W,
    y: (cy - r.top)  / r.height * W
  };
}

// ==================== СВАЙПЫ ====================
let tx=0, ty=0, moved=false;
cv.addEventListener('touchstart', e => {
  ensureAudio();
  if (state === 'menu' || state === 'shop') { handleClick(canvasPos(e)); e.preventDefault(); return; }
  if (state === 'game' && dead) { goToMenu(); e.preventDefault(); return; }
  tx = e.touches[0].clientX;
  ty = e.touches[0].clientY;
  moved = false;
  e.preventDefault();
}, {passive:false});
cv.addEventListener('touchmove', e => {
  if (state !== 'game' || dead) return;
  const dx = e.touches[0].clientX - tx;
  const dy = e.touches[0].clientY - ty;
  if (Math.hypot(dx, dy) > 25 && !moved) {
    moved = true;
    if (Math.abs(dx) > Math.abs(dy)) {
      if (dx > 0) pushDir({x:1,y:0});
      else        pushDir({x:-1,y:0});
    } else {
      if (dy > 0) pushDir({x:0,y:1});
      else        pushDir({x:0,y:-1});
    }
    tx = e.touches[0].clientX;
    ty = e.touches[0].clientY;
    moved = false;
  }
  e.preventDefault();
}, {passive:false});
cv.addEventListener('touchend', e => e.preventDefault(), {passive:false});

cv.addEventListener('click', e => {
  ensureAudio();
  if (state === 'menu' || state === 'shop') handleClick(canvasPos(e));
  else if (state === 'game' && dead) goToMenu();
});

function handleClick(p) {
  if (state === 'menu') {
    if (p.x > 130 && p.x < 430 && p.y > 280 && p.y < 345) {
      soundClick(); reset();
    } else if (p.x > 130 && p.x < 430 && p.y > 365 && p.y < 430) {
      soundClick(); state = 'shop';
    }
  } else if (state === 'shop') {
    for (const item of shopItems) {
      if (p.x > item.x && p.x < item.x+item.w && p.y > item.y && p.y < item.y+item.h) {
        selectSkin(item.key);
        return;
      }
    }
    if (p.x > 200 && p.x < 360 && p.y > 485 && p.y < 530) {
      soundClick(); state = 'menu';
    }
  }
}

function selectSkin(key) {
  const skin = SKINS[key];
  if (ownedSkins.includes(key)) {
    currentSkin = key;
    localStorage.setItem('snakeSkin', key);
    soundClick();
    showToast('Выбрано: ' + skin.name);
  } else if (coins >= skin.price) {
    coins -= skin.price;
    ownedSkins.push(key);
    currentSkin = key;
    localStorage.setItem('snakeCoins', coins);
    localStorage.setItem('snakeSkins', JSON.stringify(ownedSkins));
    localStorage.setItem('snakeSkin', key);
    coinsEl.textContent = coins;
    soundBuy();
    showToast('Куплено: ' + skin.name + '!');
  } else {
    beep(200, 0.15, 'sawtooth', 0.08);
    showToast('Не хватает монет! Нужно ' + skin.price + ' 🪙');
  }
}

// ==================== РИСОВАНИЕ ====================
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y,   x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x,   y+h, r);
  ctx.arcTo(x,   y+h, x,   y,   r);
  ctx.arcTo(x,   y,   x+w, y,   r);
  ctx.closePath();
}
function mixColor(a, b, t) {
  const pa = hexToRgb(a), pb = hexToRgb(b);
  return `rgb(${Math.round(pa[0]+(pb[0]-pa[0])*t)},${Math.round(pa[1]+(pb[1]-pa[1])*t)},${Math.round(pa[2]+(pb[2]-pa[2])*t)})`;
}
function hexToRgb(h) {
  return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
}

function drawSnake(t) {
  const skin = SKINS[currentSkin];
  for (let i = snake.length-1; i >= 0; i--) {
    const cur = snake[i];
    const prev = prevSnake[i] || cur;
    const x = (prev.x + (cur.x - prev.x) * t) * S;
    const y = (prev.y + (cur.y - prev.y) * t) * S;
    const isHead = i === 0;
    const ratio = i / Math.max(snake.length-1, 1);
    const col = mixColor(skin.body[0], skin.body[1], ratio);

    c.shadowColor = col;
    c.shadowBlur = isHead ? 16 : 8;
    c.fillStyle = isHead ? skin.head : col;
    roundRect(c, x+1, y+1, S-2, S-2, isHead ? 7 : 5);
    c.fill();
    c.shadowBlur = 0;

    if (skin.stripes && !isHead) {
      c.strokeStyle = '#fff';
      c.lineWidth = 1.5;
      for (let k=1; k<=3; k++) {
        const oy = y + (S/4)*k;
        c.beginPath();
        c.moveTo(x+4, oy);
        c.lineTo(x+S-4, oy);
        c.stroke();
      }
    }

    if (isHead) {
      c.fillStyle = skin.eye;
      const cx = x + S/2, cy = y + S/2;
      let ex1, ey1, ex2, ey2;
      if (dir.x === 1)      { ex1=cx+3; ey1=cy-3; ex2=cx+3; ey2=cy+3; }
      else if (dir.x === -1){ ex1=cx-3; ey1=cy-3; ex2=cx-3; ey2=cy+3; }
      else if (dir.y === 1) { ex1=cx-3; ey1=cy+3; ex2=cx+3; ey2=cy+3; }
      else                  { ex1=cx-3; ey1=cy-3; ex2=cx+3; ey2=cy-3; }
      c.beginPath(); c.arc(ex1, ey1, 2, 0, Math.PI*2); c.fill();
      c.beginPath(); c.arc(ex2, ey2, 2, 0, Math.PI*2); c.fill();
    }

    if (skin.crown && isHead) {
      c.fillStyle = '#ffd700';
      c.strokeStyle = '#cc9900';
      c.lineWidth = 1;
      c.beginPath();
      c.moveTo(x+4, y+2);
      c.lineTo(x+6, y-3);
      c.lineTo(x+9, y+1);
      c.lineTo(x+10, y-4);
      c.lineTo(x+11, y+1);
      c.lineTo(x+14, y-3);
      c.lineTo(x+16, y+2);
      c.closePath();
      c.fill();
      c.stroke();
      c.fillStyle = '#f00';
      c.beginPath(); c.arc(x+10, y+0.5, 1.2, 0, Math.PI*2); c.fill();
    }
  }
}

function drawButton(x, y, w, h, text, color1, color2) {
  const grd = c.createLinearGradient(x, y, x, y+h);
  grd.addColorStop(0, color1);
  grd.addColorStop(1, color2);
  c.fillStyle = grd;
  roundRect(c, x, y, w, h, 12);
  c.fill();
  c.strokeStyle = color1; c.lineWidth = 1;
  roundRect(c, x, y, w, h, 12);
  c.stroke();
  c.fillStyle = '#111';
  c.font = 'bold 20px sans-serif';
  c.textAlign = 'center';
  c.fillText(text, x + w/2, y + h/2 + 7);
  c.textAlign = 'left';
}

function drawMenu(now) {
  c.fillStyle = '#0a0a12'; c.fillRect(0,0,W,W);
  c.strokeStyle = 'rgba(0,255,0,0.05)';
  for (let i=1; i<N; i++) {
    c.beginPath(); c.moveTo(i*S,0); c.lineTo(i*S,W); c.stroke();
    c.beginPath(); c.moveTo(0,i*S); c.lineTo(W,i*S); c.stroke();
  }

  const t = now/800;
  const cx0 = W/2, cy0 = W/2;
  const rad = W*0.32;
  for (let i=0; i<12; i++) {
    const a = t - i*0.15;
    const px = cx0 + Math.cos(a)*rad;
    const py = cy0 + Math.sin(a)*rad;
    c.fillStyle = `rgba(0,255,68,${0.9 - i*0.07})`;
    c.beginPath(); c.arc(px, py, 9 - i*0.55, 0, Math.PI*2); c.fill();
  }

  c.textAlign = 'center';
  const hue = (now/20) % 360;
  c.fillStyle = `hsl(${hue},100%,60%)`;
  c.shadowColor = c.fillStyle; c.shadowBlur = 25;
  c.font = 'bold 52px sans-serif';
  c.fillText('ЗМЕЙКА+', cx0, 120);
  c.shadowBlur = 0;
  c.fillStyle = '#888'; c.font = '16px sans-serif';
  c.fillText('arcade deluxe', cx0, 148);

  drawButton(130, 280, 300, 65, '▶  ИГРАТЬ', '#0f0', '#0a0');
  drawButton(130, 365, 300, 65, '🛍  МАГАЗИН', '#ffd700', '#f90');

  c.fillStyle = '#fff'; c.font = '16px sans-serif';
  c.fillText('🏆 Рекорд: ' + best, cx0, 490);
  c.fillStyle = '#666'; c.font = '13px sans-serif';
  c.fillText('WASD / стрелки / свайпы', cx0, 518);
  c.textAlign = 'left';
}

function drawShop() {
  c.fillStyle = '#0a0a12'; c.fillRect(0,0,W,W);

  c.textAlign = 'center';
  c.fillStyle = '#ffd700'; c.shadowColor = '#ffd700'; c.shadowBlur = 15;
  c.font = 'bold 34px sans-serif';
  c.fillText('🛍 МАГАЗИН', W/2, 48);
  c.shadowBlur = 0;

  c.fillStyle = '#fff'; c.font = 'bold 20px sans-serif';
  c.fillText('🪙 ' + coins, W/2, 82);

  shopItems = [];
  const keys = Object.keys(SKINS);
  const cardW = 240, cardH = 78, gap = 14;
  const startX = (W - (cardW*2 + gap)) / 2;
  const startY = 105;

  for (let i=0; i<keys.length; i++) {
    const key = keys[i];
    const skin = SKINS[key];
    const col = i % 2;
    const row = Math.floor(i/2);
    const x = startX + col*(cardW+gap);
    const y = startY + row*(cardH+gap);

    const owned = ownedSkins.includes(key);
    const active = (key === currentSkin);

    c.fillStyle = active ? 'rgba(0,255,0,0.15)' : 'rgba(255,255,255,0.05)';
    roundRect(c, x, y, cardW, cardH, 12);
    c.fill();
    c.strokeStyle = active ? '#0f0' : 'rgba(255,255,255,0.15)';
    c.lineWidth = active ? 2 : 1;
    roundRect(c, x, y, cardW, cardH, 12);
    c.stroke();

    const previewX = x + 14, previewY = y + cardH/2;
    for (let s=0; s<4; s++) {
      const px = previewX + s*10;
      const isHead = s === 0;
      c.fillStyle = isHead ? skin.head : mixColor(skin.body[0], skin.body[1], s/4);
      c.beginPath();
      c.arc(px + 5, previewY, 5, 0, Math.PI*2);
      c.fill();
      if (skin.stripes && !isHead) {
        c.strokeStyle = '#fff'; c.lineWidth = 1;
        for (let k=1; k<=2; k++) {
          c.beginPath();
          c.moveTo(px+1, previewY - 2.5 + k*2.5);
          c.lineTo(px+9, previewY - 2.5 + k*2.5);
          c.stroke();
        }
      }
      if (skin.crown && isHead) {
        c.fillStyle = '#ffd700';
        c.beginPath();
        c.moveTo(px+0, previewY-5);
        c.lineTo(px+2, previewY-11);
        c.lineTo(px+5, previewY-7);
        c.lineTo(px+8, previewY-11);
        c.lineTo(px+10, previewY-5);
        c.closePath(); c.fill();
      }
    }

    c.fillStyle = '#fff';
    c.font = 'bold 14px sans-serif';
    c.textAlign = 'left';
    c.fillText(skin.name, x + 62, y + 28);

    if (active) {
      c.fillStyle = '#0f0'; c.font = 'bold 13px sans-serif';
      c.fillText('✓ Выбрано', x + 62, y + 54);
    } else if (owned) {
      c.fillStyle = '#0ff'; c.font = '13px sans-serif';
      c.fillText('Нажми', x + 62, y + 54);
    } else {
      c.fillStyle = coins >= skin.price ? '#ffd700' : '#f66';
      c.font = 'bold 14px sans-serif';
      c.fillText('🪙 ' + skin.price, x + 62, y + 54);
    }

    shopItems.push({ key, x, y, w: cardW, h: cardH });
  }

  drawButton(200, 485, 160, 45, '← Назад', '#888', '#555');
  c.textAlign = 'left';
}

function drawGame(now) {
  c.fillStyle = '#0a0a12';
  c.fillRect(0,0,W,W);
  c.strokeStyle = 'rgba(0,255,0,0.06)';
  for (let i=1; i<N; i++) {
    c.beginPath(); c.moveTo(i*S,0); c.lineTo(i*S,W); c.stroke();
    c.beginPath(); c.moveTo(0,i*S); c.lineTo(W,i*S); c.stroke();
  }

  const pulse = 1 + Math.sin(now/200)*0.12;
  const fs = (S-2) * pulse;
  c.shadowColor = '#f33'; c.shadowBlur = 12;
  c.fillStyle = '#f33';
  c.beginPath();
  c.arc(food.x*S + S/2, food.y*S + S/2, fs/2, 0, Math.PI*2);
  c.fill();
  c.shadowBlur = 0;

  if (bonus) {
    const cx = bonus.x*S + S/2, cy = bonus.y*S + S/2;
    c.save();
    c.translate(cx, cy);
    c.rotate(now/300);
    c.shadowColor = '#39f'; c.shadowBlur = 15;
    c.fillStyle = '#39f';
    c.beginPath();
    for (let i=0; i<5; i++) {
      const a = i * Math.PI*2/5 - Math.PI/2;
      const a2 = a + Math.PI/5;
      c.lineTo(Math.cos(a)*8, Math.sin(a)*8);
      c.lineTo(Math.cos(a2)*4, Math.sin(a2)*4);
    }
    c.closePath();
    c.fill();
    c.restore();
    c.shadowBlur = 0;
  }

  const t = dead ? 1 : Math.min(1, (now - lastStep) / ANIM_MS);
  drawSnake(t);

  for (let i = particles.length-1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.08;
    p.vx *= 0.97; p.vy *= 0.97;
    p.life -= 0.02;
    if (p.life <= 0) { particles.splice(i,1); continue; }
    c.globalAlpha = p.life;
    c.fillStyle = p.color;
    c.beginPath();
    c.arc(p.x, p.y, p.size * p.life, 0, Math.PI*2);
    c.fill();
  }
  c.globalAlpha = 1;

  if (paused && !dead) {
    c.fillStyle = 'rgba(0,0,0,0.6)'; c.fillRect(0,0,W,W);
    c.fillStyle = '#0f0'; c.font = 'bold 42px sans-serif';
    c.textAlign = 'center';
    c.fillText('ПАУЗА', W/2, W/2);
    c.font = '16px sans-serif'; c.fillStyle = '#aaa';
    c.fillText('нажми P для продолжения', W/2, W/2+35);
    c.textAlign = 'left';
  }

  if (dead) {
    c.fillStyle = 'rgba(0,0,0,0.78)'; c.fillRect(0,0,W,W);
    c.textAlign = 'center';
    c.fillStyle = '#f33'; c.font = 'bold 46px sans-serif';
    c.shadowColor = '#f33'; c.shadowBlur = 20;
    c.fillText('GAME OVER', W/2, 180);
    c.shadowBlur = 0;
    c.fillStyle = '#fff'; c.font = '26px sans-serif';
    c.fillText('Счёт: ' + score, W/2, 230);
    c.fillStyle = '#39f'; c.font = '18px sans-serif';
    c.fillText('⭐ Собрано звёзд: ' + starsCollected, W/2, 262);

    const earnedFromScore = Math.floor(score/10)*5;
    const earnedFromStars = starsCollected;
    const total = earnedFromScore + earnedFromStars;
    if (total > 0) {
      c.fillStyle = '#ffd700'; c.font = 'bold 22px sans-serif';
      c.fillText('+ ' + total + ' 🪙', W/2, 305);
    }

    if (score === best && score > 0) {
      c.fillStyle = '#ff0'; c.font = 'bold 18px sans-serif';
      c.fillText('🏆 НОВЫЙ РЕКОРД!', W/2, 342);
    }

    c.fillStyle = '#aaa'; c.font = '14px sans-serif';
    c.fillText('тап по экрану / кнопка — меню', W/2, 390);
    c.fillText('Enter — заново', W/2, 415);
    c.textAlign = 'left';
  }

  if (toast && performance.now() < toast.until) {
    const alpha = Math.min(1, (toast.until - performance.now()) / 500);
    c.globalAlpha = alpha;
    c.fillStyle = 'rgba(0,0,0,0.85)';
    roundRect(c, 60, 230, W-120, 55, 10);
    c.fill();
    c.strokeStyle = '#ffd700'; c.lineWidth = 1;
    roundRect(c, 60, 230, W-120, 55, 10);
    c.stroke();
    c.fillStyle = '#ffd700';
    c.font = 'bold 16px sans-serif';
    c.textAlign = 'center';
    c.fillText(toast.text, W/2, 264);
    c.textAlign = 'left';
    c.globalAlpha = 1;
  }
}

function loop(now) {
  if (state === 'menu') {
    drawMenu(now);
  } else if (state === 'shop') {
    drawShop();
  } else if (state === 'game') {
    if (!dead && !paused && now - lastStep >= STEP_MS) {
      lastStep = now;
      step();
    }
    if (bonus && now > bonusUntil) {
      spawnParticles(bonus.x, bonus.y, '#39f', 6);
      bonus = null;
    }
    drawGame(now);
  }
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
