<!DOCTYPE html>
<html>
<head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Червяк Ultimate Deluxe</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; overscroll-behavior: none; }
  body { display:flex; flex-direction:column; justify-content:center; align-items:center;
         margin:0; background:radial-gradient(circle at 50% 30%, #1a1a2e 0%, #0d0d15 100%);
         font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color:#fff;
         touch-action:none; user-select:none; -webkit-user-select:none; overflow:hidden;
         -webkit-tap-highlight-color: transparent; }
  canvas { background:#0a0a12; border:2px solid #0f0; border-radius:12px;
           box-shadow:0 0 30px rgba(0,255,0,0.25), inset 0 0 40px rgba(0,255,0,0.05);
           max-width:96vw; max-height:72vh; touch-action:none; display:block; }
  @media (orientation: landscape) {
    canvas { max-height: 85vh; max-width: 60vw; }
    #hud { margin-top: 4px; font-size: 12px; }
    #controls { margin-top: 6px; }
  }
  #hud { display:flex; gap:12px; margin-top:8px; font-size:13px; align-items:center; flex-wrap:wrap; justify-content:center; }
  #hud span { color:#0f0; font-weight:bold; text-shadow:0 0 8px #0f0; }
  #hud .coins span { color:#ffd700; text-shadow:0 0 8px #ffd700; }
  #hud .stars span { color:#39f; text-shadow:0 0 8px #39f; }
  #musicBtn { background:none; border:1px solid #555; color:#aaa; border-radius:8px;
              padding:4px 10px; font-size:13px; cursor:pointer; font-family:inherit; }
  #musicBtn.on { color:#0f0; border-color:#0f0; }
  #controls { display:flex; gap:10px; margin-top:10px; }
  .btn { padding:10px 22px; font-size:14px; cursor:pointer;
         border:none; border-radius:10px; color:#111; font-weight:bold;
         transition:transform .15s; font-family:inherit; }
  .btn:active { transform:scale(0.95); }
  .btn-green { background:linear-gradient(135deg,#0f0,#0a0); box-shadow:0 4px 20px rgba(0,255,0,0.4); }
  .btn-gray  { background:linear-gradient(135deg,#aaa,#666); color:#fff; box-shadow:0 4px 20px rgba(150,150,150,0.3); }
  .hidden { display:none !important; }
</style></head>
<body>
<canvas id="c" width="560" height="560"></canvas>
<div id="hud">
  <div>Счёт: <span id="score">0</span></div>
  <div class="coins">🪙 <span id="coins">0</span></div>
  <div class="stars">⭐ <span id="stars">0</span></div>
  <button id="musicBtn" title="Музыка">♪</button>
</div>
<div id="controls">
  <button id="btn" class="btn btn-green hidden">Заново</button>
  <button id="menuBtn" class="btn btn-gray hidden">← Меню</button>
</div>
<script>
const cv = document.getElementById('c');
const c = cv.getContext('2d');
const btn = document.getElementById('btn');
const menuBtn = document.getElementById('menuBtn');
const musicBtn = document.getElementById('musicBtn');
const scoreEl = document.getElementById('score');
const coinsEl = document.getElementById('coins');
const starsEl = document.getElementById('stars');
const S = 20, N = 28;
const W = N * S;
const MAX_SCORE = N * N - 1;   // 783 — все клетки поля заняты змейкой
const STEP_MS = 150;
const BONUS_MS = 3000;
const ANIM_MS = 110;

let katyaUnlocked = localStorage.getItem('snakeKatyaUnlocked') === '1';

const SKINS = {
  green:  { name:'Зелёная',      price:0,        head:'#bfffbf', body:['#00ff44','#00cc33'], eye:'#111', crown:false, stripes:false, hair:null,           glasses:null,     scale:1, lips:false, lashes:false, locked:false },
  red:    { name:'Красная',      price:10,       head:'#ffb3b3', body:['#ff3333','#cc0000'], eye:'#111', crown:false, stripes:false, hair:null,           glasses:null,     scale:1, lips:false, lashes:false, locked:false },
  blue:   { name:'Синяя',        price:10,       head:'#b3d9ff', body:['#3399ff','#0066cc'], eye:'#111', crown:false, stripes:false, hair:null,           glasses:null,     scale:1, lips:false, lashes:false, locked:false },
  adidas: { name:'Адидас',       price:25,       head:'#555555', body:['#222222','#000000'], eye:'#fff', crown:false, stripes:true,  hair:null,           glasses:null,     scale:1, lips:false, lashes:false, locked:false },
  king:   { name:'Королевская',  price:50,       head:'#ffe680', body:['#ffcc00','#cc9900'], eye:'#111', crown:true,  stripes:false, hair:null,           glasses:null,     scale:1, lips:false, lashes:false, locked:false },
  petya:  { name:'Петя',         price:0,        head:'#ffd9a0', body:['#ffbb55','#cc8800'], eye:'#111', crown:false, stripes:false, hair:'blonde',       glasses:null,     scale:1, lips:false, lashes:false, locked:false },
  koval:  { name:'Ковал',        price:50,       head:'#e8c8a0', body:['#c89860','#8a6040'], eye:'#111', crown:false, stripes:false, hair:'curly_black',  glasses:'square', scale:2, lips:false, lashes:false, locked:false },
  gavr:   { name:'Гавр',         price:150,      head:'#d0b090', body:['#a08060','#705040'], eye:'#111', crown:false, stripes:false, hair:'short_dark',   glasses:'dark',   scale:1, lips:false, lashes:false, locked:false },
  katya:  { name:'Катенька',     price:Infinity, head:'#ffe0c8', body:['#ffb0c8','#ff7a9c'], eye:'#111', crown:false, stripes:false, hair:'light_brown',  glasses:null,     scale:1, lips:true,  lashes:true,  locked:!katyaUnlocked }
};

// ==================== МУЗЫКА ====================
const TRACKS = [
  {
    name: 'Тетрис',
    melody: [
      [659,2],[494,1],[523,1],[587,1],[523,1],[494,1],[440,2],[440,2],
      [523,1],[659,2],[587,1],[523,1],[494,2],[494,1],[523,1],[587,2],
      [659,2],[523,2],[440,2],[440,2],
      [587,1],[698,2],[880,1],[784,1],[698,1],[659,2],[523,1],[659,2],
      [587,1],[523,1],[494,2],[494,1],[523,1],[587,2],[659,2],[523,2],
      [440,2],[440,2]
    ],
    bass: [131,131,131,131, 110,110,110,110, 131,131,131,131, 165,165,165,165],
    bpm: 0.16
  },
  {
    name: 'Не бойся ночи',
    melody: [
      [2637.0,1],[2489.0,1],[1975.5,1],[1661.2,1],[1480.0,1],[1318.5,1],
      [1244.5,1],[1318.5,1],[1480.0,1],[1661.2,2],
      [2637.0,1],[2489.0,1],[1975.5,1],[1661.2,1],[1480.0,1],[1318.5,1],
      [1244.5,1],[1318.5,1],[1480.0,1],[1318.5,2]
    ],
    bass: [110,110,116,116, 93,93,104,104],
    bpm: 0.26
  }
];

let currentTrackIdx = 0;
let musicOn = localStorage.getItem('snakeMusic') !== 'off';
if (localStorage.getItem('snakeTrack')) currentTrackIdx = Number(localStorage.getItem('snakeTrack')) || 0;

let state = 'menu';
let snake, dir, dirQueue, food, bonus, bonusUntil, score, dead, best;
let foodCount = 0;
let starsCollected = 0;
let paused = false;
let particles = [];
let lastStep = 0;
let prevSnake = [];
let toast = null;
let shopItems = [];
let fakeRecordPopup = null;

let coins = Number(localStorage.getItem('snakeCoins') || 0);
let ownedSkins = JSON.parse(localStorage.getItem('snakeSkins') || '["green","petya"]');
let currentSkin = localStorage.getItem('snakeSkin') || 'green';
if (!ownedSkins.includes('green')) ownedSkins.push('green');
if (!ownedSkins.includes('petya')) ownedSkins.push('petya');
if (katyaUnlocked && !ownedSkins.includes('katya')) ownedSkins.push('katya');
if (!ownedSkins.includes(currentSkin)) currentSkin = 'green';
best = Number(localStorage.getItem('snakeBest') || 0);

scoreEl.textContent = '0';
coinsEl.textContent = coins;
starsEl.textContent = '0';
musicBtn.textContent = musicOn ? '♪' : '✕';
musicBtn.classList.toggle('on', musicOn);

// ==================== ЗВУК ====================
let audioCtx, musicTimer = null, musicPlaying = false;
function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e) { audioCtx = null; }
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function beep(freq, dur=0.08, type='square', vol=0.06) {
  if (!audioCtx) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime + dur);
}
function getCurrentTrack() { return TRACKS[currentTrackIdx % TRACKS.length]; }
let melodyIdx = 0, bassIdx = 0;
function startMusic() {
  ensureAudio();
  if (musicPlaying || !audioCtx || !musicOn) return;
  musicPlaying = true; melodyIdx = 0; bassIdx = 0;
  scheduleMusicNote();
}
function stopMusic() {
  musicPlaying = false;
  if (musicTimer) { clearTimeout(musicTimer); musicTimer = null; }
}
function scheduleMusicNote() {
  if (!musicPlaying || !audioCtx || !musicOn) { musicPlaying = false; return; }
  const track = getCurrentTrack();
  const mel = track.melody;
  const [freq, beats] = mel[melodyIdx % mel.length];
  const dur = beats * track.bpm;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = 'square'; o.frequency.value = freq;
  g.gain.setValueAtTime(0.028, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur*0.85);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime + dur);
  if (melodyIdx % 2 === 0) {
    const bs = track.bass;
    const bf = bs[(bassIdx++) % bs.length];
    const bo = audioCtx.createOscillator();
    const bg = audioCtx.createGain();
    bo.type = 'triangle'; bo.frequency.value = bf;
    bg.gain.setValueAtTime(0.035, audioCtx.currentTime);
    bg.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur*1.7);
    bo.connect(bg); bg.connect(audioCtx.destination);
    bo.start(); bo.stop(audioCtx.currentTime + dur*1.8);
  }
  melodyIdx++;
  musicTimer = setTimeout(scheduleMusicNote, dur * 1000);
}
function soundEat() { beep(660, 0.08, 'square', 0.07); }
function soundBonus() {
  beep(660, 0.05, 'square', 0.07);
  setTimeout(()=>beep(880, 0.05, 'square', 0.07), 45);
  setTimeout(()=>beep(1100, 0.05, 'square', 0.07), 90);
  setTimeout(()=>beep(1320, 0.10, 'square', 0.08), 135);
  setTimeout(()=>beep(1760, 0.15, 'triangle', 0.06), 185);
}
function soundDie() { beep(200, 0.15, 'sawtooth', 0.1); setTimeout(()=>beep(120,0.3,'sawtooth',0.1), 120); }
function soundCoin() { beep(1320, 0.05, 'square', 0.06); setTimeout(()=>beep(1760, 0.08, 'square', 0.06), 50); }
function soundBuy() { beep(523, 0.07, 'square', 0.07); setTimeout(()=>beep(659, 0.07, 'square', 0.07), 60); setTimeout(()=>beep(784, 0.12, 'square', 0.07), 120); }
function soundClick() { beep(800, 0.03, 'square', 0.05); }
function soundDenied() { beep(200, 0.12, 'sawtooth', 0.08); setTimeout(()=>beep(150,0.2,'sawtooth',0.08), 120); }
function soundUnlock() {
  beep(523, 0.08, 'square', 0.07);
  setTimeout(()=>beep(659, 0.08, 'square', 0.07), 80);
  setTimeout(()=>beep(784, 0.08, 'square', 0.07), 160);
  setTimeout(()=>beep(1047, 0.15, 'triangle', 0.08), 240);
  setTimeout(()=>beep(1318, 0.25, 'triangle', 0.08), 380);
}
function vib(ms) { if (navigator.vibrate) navigator.vibrate(ms); }

function spawnParticles(gx, gy, color, count=14) {
  const cx = gx*S + S/2, cy = gy*S + S/2;
  for (let i=0; i<count; i++) {
    const a = Math.random()*Math.PI*2;
    const sp = 1 + Math.random()*3;
    particles.push({ x: cx, y: cy, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, life: 1, color, size: 2 + Math.random()*3 });
  }
}

function pushDir(newDir) {
  if (dirQueue.length >= 3) return;
  const last = dirQueue.length > 0 ? dirQueue[dirQueue.length-1] : dir;
  if (newDir.x === -last.x && newDir.y === -last.y) return;
  if (newDir.x === last.x && newDir.y === last.y) return;
  dirQueue.push(newDir);
}

function reset() {
  snake = [{x:Math.floor(N/2), y:Math.floor(N/2)}];
  prevSnake = snake.map(s=>({...s}));
  dir = {x:1,y:0};
  dirQueue = [];
  score = 0; dead = false; foodCount = 0; paused = false;
  starsCollected = 0;
  bonus = null; bonusUntil = 0;
  particles = [];
  fakeRecordPopup = null;
  scoreEl.textContent = '0';
  starsEl.textContent = '0';
  placeFood();
  btn.classList.add('hidden');
  menuBtn.classList.add('hidden');
  lastStep = performance.now();
  state = 'game';
  if (musicOn) startMusic();
}

function placeFood() {
  do { food = {x: Math.floor(Math.random()*N), y: Math.floor(Math.random()*N)}; }
  while (snake.some(s=>s.x===food.x&&s.y===food.y) ||
         (bonus && bonus.x===food.x && bonus.y===food.y));
}

function showToast(text, ms=1800) { toast = { text, until: performance.now() + ms }; }

function step() {
  if (dead || paused) return;
  if (dirQueue.length > 0) dir = dirQueue.shift();
  prevSnake = snake.map(s=>({...s}));
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

  if (head.x<0||head.x>=N||head.y<0||head.y>=N||
      snake.some(s=>s.x===head.x&&s.y===head.y)) {
    dead = true;
    soundDie(); vib([60,40,60]);

    // ===== ПАСХАЛКА НА 100+ =====
    let skipRecord = false;
    if (score >= 100) {
      skipRecord = true;
      fakeRecordPopup = {
        text: 'Ого, какой молодец, жалко тебе никто не поверит и рекорд этот не записывается',
        until: performance.now() + 6000
      };
    }

    // ===== ПАСХАЛКА: MAX_SCORE = разблокировка Катеньки =====
    if (score >= MAX_SCORE && !katyaUnlocked) {
      katyaUnlocked = true;
      localStorage.setItem('snakeKatyaUnlocked', '1');
      SKINS.katya.locked = false;
      if (!ownedSkins.includes('katya')) ownedSkins.push('katya');
      localStorage.setItem('snakeSkins', JSON.stringify(ownedSkins));
      setTimeout(() => {
        soundUnlock();
        showToast('👑 Катенька открыта! Загляни в магазин!', 4000);
      }, 3000);
    }

    const earnedFromScore = Math.floor(score / 10) * 5;
    const earnedFromStars = starsCollected;
    const total = earnedFromScore + earnedFromStars;
    if (total > 0) {
      coins += total;
      localStorage.setItem('snakeCoins', coins);
      coinsEl.textContent = coins;
      let msg = '+' + total + ' 🪙';
      if (earnedFromScore > 0 && earnedFromStars > 0) msg += ' (' + earnedFromScore + ' + ' + earnedFromStars + ')';
      if (!skipRecord) showToast(msg, 3000);
      setTimeout(soundCoin, 500);
    }

    // Рекорд НЕ записывается, если счёт 100+
    if (!skipRecord && score > best) {
      best = score;
      localStorage.setItem('snakeBest', best);
    }

    btn.classList.remove('hidden');
    menuBtn.classList.remove('hidden');
    return;
  }

  snake.unshift(head);
  if (head.x===food.x && head.y===food.y) {
    score++; foodCount++;
    scoreEl.textContent = score;
    soundEat(); vib(20);
    spawnParticles(food.x, food.y, '#f33', 12);
    placeFood();
    if (foodCount % 5 === 0) {
      do { bonus = {x: Math.floor(Math.random()*N), y: Math.floor(Math.random()*N)}; }
      while (snake.some(s=>s.x===bonus.x&&s.y===bonus.y) || (bonus.x===food.x && bonus.y===food.y));
      bonusUntil = performance.now() + BONUS_MS;
    }
  }
  else if (bonus && head.x===bonus.x && head.y===bonus.y) {
    score += 2; scoreEl.textContent = score;
    starsCollected++; starsEl.textContent = starsCollected;
    coins += 1;
    localStorage.setItem('snakeCoins', coins);
    coinsEl.textContent = coins;
    spawnParticles(bonus.x, bonus.y, '#39f', 20);
    soundBonus(); vib(30);
    showToast('+1 🪙 за звезду!', 1200);
    bonus = null;
  }
  else { snake.pop(); }
}

function goToMenu() {
  stopMusic();
  state = 'menu'; dead = false;
  btn.classList.add('hidden');
  menuBtn.classList.add('hidden');
  fakeRecordPopup = null;
}

const KEY_MAP = {
  'arrowup':{x:0,y:-1},'w':{x:0,y:-1},'ц':{x:0,y:-1},
  'arrowdown':{x:0,y:1},'s':{x:0,y:1},'ы':{x:0,y:1},
  'arrowleft':{x:-1,y:0},'a':{x:-1,y:0},'ф':{x:-1,y:0},
  'arrowright':{x:1,y:0},'d':{x:1,y:0},'в':{x:1,y:0}
};

document.addEventListener('keydown', e => {
  ensureAudio();
  const key = e.key.toLowerCase();
  if (key === 'p' || key === 'з') { if (state === 'game' && !dead) paused = !paused; e.preventDefault(); return; }
  if (state === 'game') {
    if (dead && (key === 'enter' || key === ' ')) { reset(); e.preventDefault(); return; }
    if (dead && key === 'escape') { goToMenu(); e.preventDefault(); return; }
    if (KEY_MAP[key]) { pushDir(KEY_MAP[key]); e.preventDefault(); }
  }
});

btn.addEventListener('click', () => { ensureAudio(); soundClick(); reset(); });
menuBtn.addEventListener('click', () => { ensureAudio(); soundClick(); goToMenu(); });

musicBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  ensureAudio();
  musicOn = !musicOn;
  localStorage.setItem('snakeMusic', musicOn ? 'on' : 'off');
  musicBtn.textContent = musicOn ? '♪' : '✕';
  musicBtn.classList.toggle('on', musicOn);
  if (musicOn) { if (state === 'game' && !dead) startMusic(); }
  else stopMusic();
  soundClick();
});

function canvasPos(e) {
  const r = cv.getBoundingClientRect();
  let cx, cy;
  if (e.touches && e.touches[0]) { cx = e.touches[0].clientX; cy = e.touches[0].clientY; }
  else if (e.changedTouches && e.changedTouches[0]) { cx = e.changedTouches[0].clientX; cy = e.changedTouches[0].clientY; }
  else { cx = e.clientX; cy = e.clientY; }
  return { x: (cx - r.left) / r.width * W, y: (cy - r.top) / r.height * W };
}

let tx=0, ty=0, moved=false, touchActive=false;

function onTouchStart(e) {
  ensureAudio();
  if (state === 'menu' || state === 'shop') {
    const r = cv.getBoundingClientRect();
    const t = e.touches[0];
    if (t.clientX >= r.left && t.clientX <= r.right && t.clientY >= r.top && t.clientY <= r.bottom) {
      handleClick(canvasPos(e));
    }
    e.preventDefault();
    return;
  }
  if (state === 'game' && dead) {
    if (fakeRecordPopup && performance.now() < fakeRecordPopup.until) {
      fakeRecordPopup = null;
    } else {
      goToMenu();
    }
    e.preventDefault();
    return;
  }
  if (state === 'game') {
    const t = e.touches[0];
    tx = t.clientX; ty = t.clientY;
    moved = false; touchActive = true;
  }
}

function onTouchMove(e) {
  if (state !== 'game' || dead || !touchActive) { return; }
  const t = e.touches[0];
  const dx = t.clientX - tx;
  const dy = t.clientY - ty;
  if (Math.hypot(dx, dy) > 20 && !moved) {
    moved = true;
    if (Math.abs(dx) > Math.abs(dy)) {
      if (dx > 0) pushDir({x:1,y:0}); else pushDir({x:-1,y:0});
    } else {
      if (dy > 0) pushDir({x:0,y:1}); else pushDir({x:0,y:-1});
    }
    tx = t.clientX; ty = t.clientY;
    moved = false;
  }
  e.preventDefault();
}

function onTouchEnd(e) {
  touchActive = false;
  if (state === 'game' || state === 'menu' || state === 'shop') e.preventDefault();
}

document.addEventListener('touchstart', onTouchStart, {passive:false});
document.addEventListener('touchmove', onTouchMove, {passive:false});
document.addEventListener('touchend', onTouchEnd, {passive:false});
document.addEventListener('touchcancel', onTouchEnd, {passive:false});

cv.addEventListener('click', e => {
  ensureAudio();
  if (state === 'menu' || state === 'shop') handleClick(canvasPos(e));
  else if (state === 'game' && dead) {
    if (fakeRecordPopup && performance.now() < fakeRecordPopup.until) {
      fakeRecordPopup = null;
    } else {
      goToMenu();
    }
  }
});

function handleClick(p) {
  if (state === 'menu') {
    if (p.x > 130 && p.x < 430 && p.y > 300 && p.y < 365) {
      soundClick(); reset();
    } else if (p.x > 130 && p.x < 430 && p.y > 385 && p.y < 450) {
      soundClick(); state = 'shop';
    } else if (p.x > 130 && p.x < 430 && p.y > 500 && p.y < 540) {
      currentTrackIdx = (currentTrackIdx + 1) % TRACKS.length;
      localStorage.setItem('snakeTrack', currentTrackIdx);
      soundClick();
      showToast('Трек: ' + TRACKS[currentTrackIdx].name, 1500);
    }
  } else if (state === 'shop') {
    for (const item of shopItems) {
      if (p.x > item.x && p.x < item.x+item.w && p.y > item.y && p.y < item.y+item.h) {
        selectSkin(item.key); return;
      }
    }
    if (p.x > 200 && p.x < 360 && p.y > 425 && p.y < 465) {
      soundClick(); state = 'menu';
    }
  }
}

function selectSkin(key) {
  const skin = SKINS[key];
  if (skin.locked) {
    soundDenied(); vib([30,30,30]);
    // Туманный отказ — без спойлеров
    const msgs = [
      '🔒 Катенька неприступна!',
      '💔 Недоступна... может, надо что-то особенное?',
      '∞ — это не цена, это загадка',
      '🔒 Ха-ха! Не сегодня!'
    ];
    showToast(msgs[Math.floor(Math.random()*msgs.length)], 2500);
    return;
  }
  if (ownedSkins.includes(key)) {
    currentSkin = key;
    localStorage.setItem('snakeSkin', key);
    soundClick(); showToast('Выбрано: ' + skin.name);
  } else if (coins >= skin.price) {
    coins -= skin.price;
    ownedSkins.push(key); currentSkin = key;
    localStorage.setItem('snakeCoins', coins);
    localStorage.setItem('snakeSkins', JSON.stringify(ownedSkins));
    localStorage.setItem('snakeSkin', key);
    coinsEl.textContent = coins;
    soundBuy(); showToast('Куплено: ' + skin.name + '!');
  } else {
    beep(200, 0.15, 'sawtooth', 0.08);
    showToast('Не хватает монет! Нужно ' + skin.price + ' 🪙');
  }
}

// ==================== РИСОВАНИЕ ====================
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}
function mixColor(a, b, t) {
  const pa = hexToRgb(a), pb = hexToRgb(b);
  return `rgb(${Math.round(pa[0]+(pb[0]-pa[0])*t)},${Math.round(pa[1]+(pb[1]-pa[1])*t)},${Math.round(pa[2]+(pb[2]-pa[2])*t)})`;
}
function hexToRgb(h) { return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }
function dirToAngle(dx, dy) {
  if (dx === 1) return 0;
  if (dx === -1) return Math.PI;
  if (dy === 1) return Math.PI/2;
  if (dy === -1) return -Math.PI/2;
  return 0;
}

function drawLightBrownHair(R) {
  c.fillStyle = '#c9a97a';
  c.strokeStyle = '#a88a5c';
  c.lineWidth = 1;
  c.beginPath();
  c.arc(-R*0.3, 0, R*1.1, Math.PI*0.45, Math.PI*1.55);
  c.closePath();
  c.fill(); c.stroke();
  for (const side of [-1, 1]) {
    roundRect(c, -R*1.0, side*R*0.45 - R*0.28, R*1.45, R*0.55, R*0.25);
    c.fill(); c.stroke();
    roundRect(c, -R*0.85, side*R*0.95 - R*0.25, R*1.3, R*0.55, R*0.25);
    c.fill(); c.stroke();
    roundRect(c, -R*0.7, side*R*1.45 - R*0.22, R*1.15, R*0.5, R*0.22);
    c.fill(); c.stroke();
  }
  c.beginPath();
  c.arc(R*0.35, -R*0.25, R*0.7, -Math.PI*0.7, Math.PI*0.1);
  c.closePath();
  c.fill(); c.stroke();
  c.strokeStyle = 'rgba(255,240,200,0.5)';
  c.lineWidth = 1.2;
  c.beginPath();
  c.arc(-R*0.3, 0, R*0.9, Math.PI*0.55, Math.PI*1.2);
  c.stroke();
}

function drawKissLips(R) {
  const lx = R*0.55, ly = R*0.15;
  const lw = R*0.32, lh = R*0.22;
  c.fillStyle = '#e8467a';
  c.strokeStyle = '#b0284f';
  c.lineWidth = 0.8;
  c.beginPath();
  c.moveTo(lx - lw, ly);
  c.quadraticCurveTo(lx - lw*0.6, ly - lh, lx - lw*0.2, ly - lh*0.3);
  c.quadraticCurveTo(lx, ly - lh*0.9, lx + lw*0.2, ly - lh*0.3);
  c.quadraticCurveTo(lx + lw*0.6, ly - lh, lx + lw, ly);
  c.closePath();
  c.fill(); c.stroke();
  c.beginPath();
  c.moveTo(lx - lw, ly);
  c.quadraticCurveTo(lx, ly + lh*1.3, lx + lw, ly);
  c.closePath();
  c.fill(); c.stroke();
  c.fillStyle = 'rgba(255,255,255,0.5)';
  c.beginPath();
  c.ellipse(lx - lw*0.3, ly - lh*0.15, lw*0.18, lh*0.12, 0, 0, Math.PI*2);
  c.fill();
}

function drawLashes(R) {
  c.strokeStyle = '#111';
  c.lineWidth = Math.max(1, R*0.08);
  c.lineCap = 'round';
  const eyeX = R*0.35;
  const eyeYs = [-R*0.35, R*0.35];
  for (const ey of eyeYs) {
    for (let i = 0; i < 3; i++) {
      const ox = eyeX + R*0.05 + i * R*0.08;
      const oy = ey + (ey < 0 ? -R*0.05 : R*0.05);
      c.beginPath();
      c.moveTo(ox, oy);
      c.lineTo(ox + R*0.12, oy + (ey < 0 ? -R*0.08 : R*0.08));
      c.stroke();
    }
  }
}

function drawHairAndGlasses(cx, cy, R, skin, angle) {
  c.save(); c.translate(cx, cy); c.rotate(angle);
  if (skin.hair === 'blonde') {
    c.fillStyle = '#f5e6a8'; c.strokeStyle = '#d4c07a'; c.lineWidth = 1;
    c.beginPath(); c.arc(-R*0.35, 0, R*0.95, Math.PI*0.5, Math.PI*1.5); c.closePath(); c.fill(); c.stroke();
    roundRect(c, -R*0.9, -R*1.05, R*1.3, R*0.5, R*0.22); c.fill(); c.stroke();
    roundRect(c, -R*0.9, R*0.55, R*1.3, R*0.5, R*0.22); c.fill(); c.stroke();
    c.beginPath(); c.arc(R*0.45, 0, R*0.55, -Math.PI*0.55, Math.PI*0.55); c.closePath(); c.fill(); c.stroke();
  } else if (skin.hair === 'curly_black') {
    c.fillStyle = '#1a1a1a'; c.strokeStyle = '#000'; c.lineWidth = 0.5;
    for (let i = 0; i < 6; i++) {
      const a = Math.PI + (i/5)*Math.PI, r = R * 0.85;
      c.beginPath(); c.arc(Math.cos(a)*r, Math.sin(a)*r, R*0.4, 0, Math.PI*2); c.fill(); c.stroke();
    }
    for (let side = -1; side <= 1; side += 2) {
      for (let i = 0; i < 3; i++) {
        c.beginPath(); c.arc(side*(R+1)*0.85, -R*0.3 + i*R*0.55, R*0.42, 0, Math.PI*2); c.fill(); c.stroke();
      }
    }
  } else if (skin.hair === 'short_dark') {
    c.fillStyle = '#2a1a10'; c.strokeStyle = '#000'; c.lineWidth = 0.5;
    c.beginPath(); c.arc(0, 0, R*1.0, Math.PI*0.5, Math.PI*1.5); c.lineTo(R*0.2, -R*1.0); c.lineTo(R*0.2, R*1.0); c.closePath(); c.fill(); c.stroke();
    c.beginPath(); c.arc(R*0.35, -R*0.5, R*0.3, Math.PI, Math.PI*2); c.fill();
  } else if (skin.hair === 'light_brown') {
    drawLightBrownHair(R);
  }
  if (skin.stripes) {
    c.strokeStyle = 'rgba(255,255,255,0.95)';
    c.lineWidth = Math.max(1.2, R*0.14);
    for (let k = -1; k <= 1; k++) {
      const oy = k * R*0.5;
      c.beginPath();
      c.moveTo(-R*0.55, oy);
      c.lineTo(R*0.55, oy);
      c.stroke();
    }
  }
  if (skin.glasses === 'square') {
    c.strokeStyle = '#000'; c.lineWidth = Math.max(1.5, R*0.18);
    const gx = R*0.15, gw = R*0.45, gh = R*0.32, gy_top = -R*0.55, gy_bot = R*0.23;
    c.strokeRect(gx, gy_top, gw, gh); c.strokeRect(gx, gy_bot, gw, gh);
    c.beginPath(); c.moveTo(gx+gw, gy_top+gh/2); c.lineTo(gx+gw, gy_bot+gh/2); c.stroke();
    c.fillStyle = 'rgba(0,0,0,0.5)';
    c.fillRect(gx+1, gy_top+1, gw-2, gh-2); c.fillRect(gx+1, gy_bot+1, gw-2, gh-2);
  } else if (skin.glasses === 'dark') {
    c.fillStyle = '#000'; roundRect(c, R*0.1, -R*0.75, R*0.45, R*1.5, R*0.12); c.fill();
    c.fillStyle = 'rgba(255,255,255,0.35)';
    c.fillRect(R*0.18, -R*0.55, R*0.08, R*0.25); c.fillRect(R*0.18, R*0.2, R*0.08, R*0.25);
  }
  if (skin.lips) drawKissLips(R);
  if (skin.lashes) drawLashes(R);
  c.restore();
}

function drawSnake(t) {
  const skin = SKINS[currentSkin], sc = skin.scale || 1, cell = S * sc, offset = (cell - S) / 2;
  const angle = dirToAngle(dir.x, dir.y);
  for (let i = snake.length-1; i >= 0; i--) {
    const cur = snake[i], prev = prevSnake[i] || cur;
    const x = (prev.x + (cur.x - prev.x) * t) * S - offset;
    const y = (prev.y + (cur.y - prev.y) * t) * S - offset;
    const isHead = i === 0, ratio = i / Math.max(snake.length-1, 1);
    const col = mixColor(skin.body[0], skin.body[1], ratio);
    const pad = Math.max(1, 2 / sc), radius = isHead ? (7 * sc) : (5 * sc);
    c.shadowColor = col; c.shadowBlur = isHead ? 16 : 8;
    c.fillStyle = isHead ? skin.head : col;
    roundRect(c, x+pad, y+pad, cell-pad*2, cell-pad*2, radius); c.fill(); c.shadowBlur = 0;
    if (skin.stripes && !isHead) {
      c.strokeStyle = '#fff'; c.lineWidth = 1.5;
      for (let k=1; k<=3; k++) { const oy = y + (cell/4)*k; c.beginPath(); c.moveTo(x+4, oy); c.lineTo(x+cell-4, oy); c.stroke(); }
    }
    if (isHead && !skin.glasses) {
      c.fillStyle = skin.eye;
      const cx = x + cell/2, cy = y + cell/2, eo = 3 * sc, er = 2 * Math.min(sc, 1.5);
      let ex1, ey1, ex2, ey2;
      if (dir.x === 1) { ex1=cx+eo; ey1=cy-eo; ex2=cx+eo; ey2=cy+eo; }
      else if (dir.x === -1) { ex1=cx-eo; ey1=cy-eo; ex2=cx-eo; ey2=cy+eo; }
      else if (dir.y === 1) { ex1=cx-eo; ey1=cy+eo; ex2=cx+eo; ey2=cy+eo; }
      else { ex1=cx-eo; ey1=cy-eo; ex2=cx+eo; ey2=cy-eo; }
      c.beginPath(); c.arc(ex1, ey1, er, 0, Math.PI*2); c.fill();
      c.beginPath(); c.arc(ex2, ey2, er, 0, Math.PI*2); c.fill();
    }
    if (skin.crown && isHead) {
      c.fillStyle = '#ffd700'; c.strokeStyle = '#cc9900'; c.lineWidth = 1;
      c.beginPath(); c.moveTo(x+4,y+2); c.lineTo(x+6,y-3); c.lineTo(x+9,y+1); c.lineTo(x+10,y-4);
      c.lineTo(x+11,y+1); c.lineTo(x+14,y-3); c.lineTo(x+16,y+2); c.closePath(); c.fill(); c.stroke();
      c.fillStyle = '#f00'; c.beginPath(); c.arc(x+10, y+0.5, 1.2, 0, Math.PI*2); c.fill();
    }
    if (isHead) drawHairAndGlasses(x + cell/2, y + cell/2, cell/2, skin, angle);
  }
}

function drawSkinPreview(cx, cy, skin, scale=1) {
  const R = 7 * scale;
  c.fillStyle = skin.body[0]; c.beginPath(); c.arc(cx - R*1.6, cy, R*0.75, 0, Math.PI*2); c.fill();
  c.fillStyle = skin.head; c.beginPath(); c.arc(cx, cy, R, 0, Math.PI*2); c.fill();
  if (!skin.glasses) {
    c.fillStyle = skin.eye;
    c.beginPath(); c.arc(cx - R*0.1, cy - R*0.25, R*0.18, 0, Math.PI*2); c.fill();
    c.beginPath(); c.arc(cx - R*0.1, cy + R*0.25, R*0.18, 0, Math.PI*2); c.fill();
  }
  if (skin.crown) {
    c.fillStyle = '#ffd700';
    c.beginPath(); c.moveTo(cx-R*0.7,cy-R*0.8); c.lineTo(cx-R*0.5,cy-R*1.3); c.lineTo(cx-R*0.2,cy-R*1.0);
    c.lineTo(cx,cy-R*1.4); c.lineTo(cx+R*0.2,cy-R*1.0); c.lineTo(cx+R*0.5,cy-R*1.3); c.lineTo(cx+R*0.7,cy-R*0.8);
    c.closePath(); c.fill();
  }
  drawHairAndGlasses(cx, cy, R, skin, 0);
}

function drawButton(x, y, w, h, text, color1, color2) {
  const grd = c.createLinearGradient(x, y, x, y+h);
  grd.addColorStop(0, color1); grd.addColorStop(1, color2);
  c.fillStyle = grd; roundRect(c, x, y, w, h, 12); c.fill();
  c.strokeStyle = color1; c.lineWidth = 1; roundRect(c, x, y, w, h, 12); c.stroke();
  c.fillStyle = '#111'; c.font = 'bold 20px sans-serif'; c.textAlign = 'center';
  c.fillText(text, x + w/2, y + h/2 + 7); c.textAlign = 'left';
}

function drawMenu(now) {

function drawShop() {
  c.fillStyle = '#0a0a12'; c.fillRect(0,0,W,W);
  c.textAlign = 'center';
  c.fillStyle = '#ffd700'; c.shadowColor = '#ffd700'; c.shadowBlur = 15;
  c.font = 'bold 30px sans-serif'; c.fillText('МАГАЗИН', W/2, 40);
  c.shadowBlur = 0;
  c.fillStyle = '#fff'; c.font = 'bold 18px sans-serif'; c.fillText('🪙 ' + coins, W/2, 68);

  shopItems = [];
  const keys = Object.keys(SKINS);
  const cardW = 160, cardH = 60, gap = 8, cols = 2;
  const startX = (W - (cardW*cols + gap*(cols-1))) / 2, startY = 82;
  for (let i=0; i<keys.length; i++) {
    const key = keys[i], skin = SKINS[key], col = i % cols, row = Math.floor(i/cols);
    const x = startX + col*(cardW+gap), y = startY + row*(cardH+gap);
    const owned = ownedSkins.includes(key), active = (key === currentSkin);
    const locked = skin.locked;

    if (locked) {
      c.fillStyle = 'rgba(255,100,180,0.08)';
    } else {
      c.fillStyle = active ? 'rgba(0,255,0,0.15)' : 'rgba(255,255,255,0.05)';
    }
    roundRect(c, x, y, cardW, cardH, 12); c.fill();
    c.strokeStyle = locked ? '#ff69b4' : (active ? '#0f0' : 'rgba(255,255,255,0.15)');
    c.lineWidth = locked ? 2 : (active ? 2 : 1);
    if (locked) { c.setLineDash([4,3]); }
    roundRect(c, x, y, cardW, cardH, 12); c.stroke();
    c.setLineDash([]);

    const previewScale = (skin.scale || 1) > 1 ? 1.1 : 0.9;
    drawSkinPreview(x + 22, y + cardH/2, skin, previewScale);

    c.fillStyle = locked ? '#ff9bc8' : '#fff';
    c.font = 'bold 11px sans-serif'; c.textAlign = 'left';
    c.fillText(skin.name, x + 44, y + 22);

    // Катенька снова с ∞ — загадка без спойлеров
    if (locked) {
      c.fillStyle = '#ff69b4'; c.font = 'bold 13px sans-serif';
      c.fillText('∞ 🪙', x + 44, y + 42);
    } else if (active) { c.fillStyle = '#0f0'; c.font = 'bold 10px sans-serif'; c.fillText('✓ Выбрано', x + 44, y + 42); }
    else if (owned) { c.fillStyle = '#0ff'; c.font = '10px sans-serif'; c.fillText('Нажми', x + 44, y + 42); }
    else { c.fillStyle = coins >= skin.price ? '#ffd700' : '#f66'; c.font = 'bold 11px sans-serif'; c.fillText('🪙 ' + skin.price, x + 44, y + 42); }

    shopItems.push({ key, x, y, w: cardW, h: cardH });
  }
  drawButton(200, 425, 160, 40, '← Назад', '#888', '#555');
  c.textAlign = 'left';
}

function drawGame(now) {
  c.fillStyle = '#0a0a12'; c.fillRect(0,0,W,W);
  c.strokeStyle = 'rgba(0,255,0,0.06)';
  for (let i=1; i<N; i++) {
    c.beginPath(); c.moveTo(i*S,0); c.lineTo(i*S,W); c.stroke();
    c.beginPath(); c.moveTo(0,i*S); c.lineTo(W,i*S); c.stroke();
  }
  const pulse = 1 + Math.sin(now/200)*0.12, fs = (S-2) * pulse;
  c.shadowColor = '#f33'; c.shadowBlur = 12; c.fillStyle = '#f33';
  c.beginPath(); c.arc(food.x*S + S/2, food.y*S + S/2, fs/2, 0, Math.PI*2); c.fill(); c.shadowBlur = 0;
  if (bonus) {
    const cx = bonus.x*S + S/2, cy = bonus.y*S + S/2;
    c.save(); c.translate(cx, cy); c.rotate(now/300);
    c.shadowColor = '#39f'; c.shadowBlur = 15; c.fillStyle = '#39f';
    c.beginPath();
    for (let i=0; i<5; i++) {
      const a = i * Math.PI*2/5 - Math.PI/2, a2 = a + Math.PI/5;
      c.lineTo(Math.cos(a)*8, Math.sin(a)*8); c.lineTo(Math.cos(a2)*4, Math.sin(a2)*4);
    }
    c.closePath(); c.fill(); c.restore(); c.shadowBlur = 0;
  }
  const t = dead ? 1 : Math.min(1, (now - lastStep) / ANIM_MS);
  drawSnake(t);
  for (let i = particles.length-1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.08; p.vx *= 0.97; p.vy *= 0.97; p.life -= 0.02;
    if (p.life <= 0) { particles.splice(i,1); continue; }
    c.globalAlpha = p.life; c.fillStyle = p.color;
    c.beginPath(); c.arc(p.x, p.y, p.size * p.life, 0, Math.PI*2); c.fill();
  }
  c.globalAlpha = 1;
  if (paused && !dead) {
    c.fillStyle = 'rgba(0,0,0,0.6)'; c.fillRect(0,0,W,W);
    c.fillStyle = '#0f0'; c.font = 'bold 42px sans-serif'; c.textAlign = 'center';
    c.fillText('ПАУЗА', W/2, W/2);
    c.font = '16px sans-serif'; c.fillStyle = '#aaa'; c.fillText('нажми P', W/2, W/2+35);
    c.textAlign = 'left';
  }
  if (dead) {
    c.fillStyle = 'rgba(0,0,0,0.78)'; c.fillRect(0,0,W,W);
    c.textAlign = 'center';
    c.fillStyle = '#f33'; c.font = 'bold 46px sans-serif'; c.shadowColor = '#f33'; c.shadowBlur = 20;
    c.fillText('GAME OVER', W/2, 180); c.shadowBlur = 0;
    c.fillStyle = '#fff'; c.font = '26px sans-serif'; c.fillText('Счёт: ' + score, W/2, 230);
    c.fillStyle = '#39f'; c.font = '18px sans-serif'; c.fillText('⭐ ' + starsCollected, W/2, 262);
    const total = Math.floor(score/10)*5 + starsCollected;
    if (total > 0 && score < 100) { c.fillStyle = '#ffd700'; c.font = 'bold 22px sans-serif'; c.fillText('+ ' + total + ' 🪙', W/2, 305); }
    if (score === best && score > 0 && score < 100) { c.fillStyle = '#ff0'; c.font = 'bold 18px sans-serif'; c.fillText('🏆 РЕКОРД!', W/2, 342); }
    c.fillStyle = '#aaa'; c.font = '14px sans-serif'; c.fillText('тап / кнопка — меню', W/2, 390);
    c.fillText('Enter — заново', W/2, 415);
    c.textAlign = 'left';
  }
  if (toast && performance.now() < toast.until) {
    const alpha = Math.min(1, (toast.until - performance.now()) / 500);
    c.globalAlpha = alpha; c.fillStyle = 'rgba(0,0,0,0.85)';
    roundRect(c, 60, 230, W-120, 55, 10); c.fill();
    c.strokeStyle = '#ffd700'; c.lineWidth = 1; roundRect(c, 60, 230, W-120, 55, 10); c.stroke();
    c.fillStyle = '#ffd700'; c.font = 'bold 16px sans-serif'; c.textAlign = 'center';
    c.fillText(toast.text, W/2, 264); c.textAlign = 'left'; c.globalAlpha = 1;
  }
  if (fakeRecordPopup && performance.now() < fakeRecordPopup.until) {
    const alpha = Math.min(1, (fakeRecordPopup.until - performance.now()) / 800);
    c.globalAlpha = alpha;
    c.fillStyle = 'rgba(20,0,30,0.94)';
    roundRect(c, 30, 100, W-60, 160, 16); c.fill();
    c.strokeStyle = '#ff69b4'; c.lineWidth = 2;
    roundRect(c, 30, 100, W-60, 160, 16); c.stroke();
    c.fillStyle = '#ff69b4'; c.font = 'bold 18px sans-serif'; c.textAlign = 'center';
    c.fillText('😂 ПАСХАЛКА', W/2, 130);
    c.fillStyle = '#fff'; c.font = '15px sans-serif';
    const words = fakeRecordPopup.text.split(' ');
    let line = '', lines = [];
    for (const w of words) {
      const test = line ? line + ' ' + w : w;
      if (c.measureText(test).width > W-100) { lines.push(line); line = w; }
      else line = test;
    }
    lines.push(line);
    lines.forEach((ln, i) => c.fillText(ln, W/2, 160 + i*22));
    c.fillStyle = '#aaa'; c.font = '12px sans-serif';
    c.fillText('(нажми, чтобы закрыть)', W/2, 245);
    c.textAlign = 'left'; c.globalAlpha = 1;
  }
}

function loop(now) {
  if (state === 'menu') drawMenu(now);
  else if (state === 'shop') drawShop();
  else if (state === 'game') {
    if (!dead && !paused && now - lastStep >= STEP_MS) { lastStep = now; step(); }
    if (bonus && now > bonusUntil) { spawnParticles(bonus.x, bonus.y, '#39f', 6); bonus = null; }
    drawGame(now);
  }
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
